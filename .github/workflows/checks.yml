# Runs on every pull request and every push to main. Make "checks" a required status check
# in the branch rules for main, so nothing merges unless the data, schema and site all pass.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the Python packages the checks need
        run: pip install -r requirements.txt

      - name: Data, schema and wording checks
        run: for t in tests/*.py; do echo "== $t"; python3 "$t" || exit 1; done

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build the site
        run: npm ci --prefix site && npm run build --prefix site

      - name: Analytical and form runtime regressions
        run: npm test --prefix site

      - name: Preview build cannot publish named scores, even with local opt-in
        env:
          VERCEL_ENV: preview
          KINDERFORM_PRIVATE_NAMED_RESULTS: "true"
        run: npm run build --prefix site

      - name: Production build cannot publish named scores, even with local opt-in
        env:
          VERCEL_ENV: production
          KINDERFORM_PRIVATE_NAMED_RESULTS: "true"
        run: npm run build --prefix site

      - name: A development NODE_ENV cannot turn a build into local review
        env:
          NODE_ENV: development
          KINDERFORM_PRIVATE_NAMED_RESULTS: "true"
        run: npm run build --prefix site

      - name: Plain-language check (report only)
        run: python3 tools/plain_check.py site/dist | grep -v ' 0 of 25+ words, 0 avoided words' || true
