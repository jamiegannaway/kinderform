</style><rect class="card" x="0.5" y="0.5" width="759" height="281" rx="12" stroke-width="1"/><text x="24" y="34" class="t1" font-size="16" text-anchor="start" font-weight="600">Front doors by who runs them</text><text x="24" y="56" class="t2" font-size="13" text-anchor="start" font-weight="400">Includes private organisations a state contracts to run its front door.</text><text x="218" y="95" class="t2" font-size="12" text-anchor="end" font-weight="400">Public</text><path class="s1" d="M230,80 h376.0 a4,4 0 0 1 4,4 v16.0 a4,4 0 0 1 -4,4 h-376.0 z"/><text x="618.0" y="96" class="t1" font-size="12" text-anchor="start" font-weight="500">800</text><text x="218" y="129" class="t2" font-size="12" text-anchor="end" font-weight="400">Private non-profit</text><path class="s1" d="M230,114 h186.9 a4,4 0 0 1 4,4 v16.0 a4,4 0 0 1 -4,4 h-186.9 z"/><text x="428.95" y="130" class="t1" font-size="12" text-anchor="start" font-weight="500">402</text><text x="218" y="163" class="t2" font-size="12" text-anchor="end" font-weight="400">Tribal</text><path class="s1" d="M230,148 h38.3 a4,4 0 0 1 4,4 v16.0 a4,4 0 0 1 -4,4 h-38.3 z"/><text x="280.275" y="164" class="t1" font-size="12" text-anchor="start" font-weight="500">89</text><text x="218" y="197" class="t2" font-size="12" text-anchor="end" font-weight="400">Private for-profit</text><path class="s1" d="M230,182 h0.0 a3.8,3.8 0 0 1 3.8,3.8 v16.4 a3.8,3.8 0 0 1 -3.8,3.8 h-0.0 z"/><text x="241.8" y="198" class="t1" font-size="12" text-anchor="start" font-weight="500">8</text><text x="24" y="234" class="t1" font-size="13" text-anchor="start" font-weight="600">364 private licensed agencies so far</text><text x="24" y="254" class="t2" font-size="13" text-anchor="start" font-weight="400">A first sample of up to 10 per state.</text></svg>
