</style><rect class="bg" width="760" height="254" rx="8"/><text x="24" y="32" class="t1" font-size="17" text-anchor="start" font-weight="600">The US survey in numbers</text><text x="24.0" y="86" class="t1" font-size="34" text-anchor="start" font-weight="700">51</text><text x="24.0" y="108" class="t1" font-size="13" text-anchor="start" font-weight="600">Jurisdictions</text><text x="24.0" y="126" class="t2" font-size="12" text-anchor="start" font-weight="400">50 states and DC</text><text x="202.0" y="86" class="t1" font-size="34" text-anchor="start" font-weight="700">1,257</text><text x="202.0" y="108" class="t1" font-size="13" text-anchor="start" font-weight="600">Front doors</text><text x="202.0" y="126" class="t2" font-size="12" text-anchor="start" font-weight="400">322 of them private agencies</text><text x="380.0" y="86" class="t1" font-size="34" text-anchor="start" font-weight="700">663</text><text x="380.0" y="108" class="t1" font-size="13" text-anchor="start" font-weight="600">Policy rules</text><text x="380.0" y="126" class="t2" font-size="12" text-anchor="start" font-weight="400">51 jurisdictions</text><text x="558.0" y="86" class="t1" font-size="34" text-anchor="start" font-weight="700">1,941</text><text x="558.0" y="108" class="t1" font-size="13" text-anchor="start" font-weight="600">Form questions</text><text x="558.0" y="126" class="t2" font-size="12" text-anchor="start" font-weight="400">from 46 forms</text><text x="24.0" y="178" class="t1" font-size="34" text-anchor="start" font-weight="700">235</text><text x="24.0" y="200" class="t1" font-size="13" text-anchor="start" font-weight="600">Application forms</text><text x="24.0" y="218" class="t2" font-size="12" text-anchor="start" font-weight="400">84 with a direct link</text><text x="202.0" y="178" class="t1" font-size="34" text-anchor="start" font-weight="700">14</text><text x="202.0" y="200" class="t1" font-size="13" text-anchor="start" font-weight="600">Reply promises</text><text x="202.0" y="218" cla