"400">Application forms</text><text x="38.0" y="210" class="t1" font-size="26" text-anchor="start" font-weight="600">236</text><text x="38.0" y="232" class="t2" font-size="11" text-anchor="start" font-weight="400">89 with a direct link</text><rect class="card" x="205.0" y="154" width="169.0" height="92" rx="10" stroke-width="1"/><text x="219.0" y="178" class="t2" font-size="12" text-anchor="start" font-weight="400">Reply promises</text><text x="219.0" y="210" class="t1" font-size="26" text-anchor="start" font-weight="600">16</text><text x="219.0" y="232" class="t2" font-size="11" text-anchor="start" font-weight="400">published on front-door pages</text><rect class="card" x="386.0" y="154" width="169.0" height="92" rx="10" stroke-width="1"/><text x="400.0" y="178" class="t2" font-size="12" text-anchor="start" font-weight="400">Pages opened</text><text x="400.0" y="210" class="t1" font-size="26" text-anchor="start" font-weight="600">406</text><text x="400.0" y="232" class="t2" font-size="11" text-anchor="start" font-weight="400">front doors checked live</text><rect class="card" x="567.0" y="154" width="169.0" height="92" rx="10" stroke-width="1"/><text x="581.0" y="178" class="t2" font-size="12" text-anchor="start" font-weight="400">Verified rows</text><text x="581.0" y="210" class="t1" font-size="26" text-anchor="start" font-weight="600">0</text><text x="581.0" y="232" class="t2" font-size="11" text-anchor="start" font-weight="400">by a second person</text></svg>
