</style><rect class="bg" width="760" height="454" rx="8"/><text x="24" y="32" class="t1" font-size="17" text-anchor="start" font-weight="600">What application forms ask, beyond contact details</text><text x="24" y="54" class="t2" font-size="13" text-anchor="start" font-weight="400">Share of the 17 fillable application forms read that ask about each topic.</text><text x="220" y="89" class="t1" font-size="13" text-anchor="end" font-weight="400">Date of birth or age</text><line class="base" x1="230" x2="230" y1="72" y2="96" stroke-width="1"/><path class="s1" d="M230,76 h330.4 a4,4 0 0 1 4,4 v8.0 a4,4 0 0 1 -4,4 h-330.4 z"/><text x="572.4" y="89" class="t2" font-size="12" text-anchor="start" font-weight="400">88%</text><text x="220" y="119" class="t1" font-size="13" text-anchor="end" font-weight="400">Race, gender or faith</text><line class="base" x1="230" x2="230" y1="102" y2="126" stroke-width="1"/><path class="s1" d="M230,106 h243.0 a4,4 0 0 1 4,4 v8.0 a4,4 0 0 1 -4,4 h-243.0 z"/><text x="485.0" y="119" class="t2" font-size="12" text-anchor="start" font-weight="400">65%</text><text x="220" y="149" class="t1" font-size="13" text-anchor="end" font-weight="400">Relationship status</text><line class="base" x1="230" x2="230" y1="132" y2="156" stroke-width="1"/><path class="s1" d="M230,136 h243.0 a4,4 0 0 1 4,4 v8.0 a4,4 0 0 1 -4,4 h-243.0 z"/><text x="485.0" y="149" class="t2" font-size="12" text-anchor="start" font-weight="400">65%</text><text x="220" y="179" class="t1" font-size="13" text-anchor="end" font-weight="400">Work</text><line class="base" x1="230" x2="230" y1="162" y2="186" stroke-width="1"/><path class="s1" d="M230,166 h243.0 a4,4 0 0 1 4,4 v8.0 a4,4 0 0 1 -4,4 h-243.0 z"/><text x="485.0" y="179" class="t2" font-size="12" text-anchor="start" font-weight="400">65%</text><text x="220" y="209" class="t1" font-size="13" text-anchor="end" font-weight="400">Fostering or adopting</text><line class="base" x1="230" x2="230" y1="192" y2="216" stroke-width="1"/><path class="s1" d="M230,196 h220.2 a4,4 0 0 1 4,4 v8.0 a4,4 0 0 1 -4,4 h-220.2 z"/><text x="462.2" y="209" class="t2" font-size="12" text-anchor="start" font-weight="400">59%</text><text x="220" y="239" class="t1" font-size="13" text-anchor="end" font-weight="400">Education</text><line class="base" x1="230" x2="230" y1="222" y2="246" stroke-width="1"/><path class="s1" d="M230,226 h197.4 a4,4 0 0 1 4,4 v8.0 a4,4 0 0 1 -4,4 h-197.4 z"/><text x="439.4" y="239" class="t2" font-size="12" text-anchor="start" font-weight="400">53%</text><text x="220" y="269" class="t1" font-size="13" text-anchor="end" font-weight="400">Open comment box</text><line class="base" x1="230" x2="230" y1="252" y2="276" stroke-width="1"/><path class="s1" d="M230,256 h151.8 a4,4 0 0 1 4,4 v8.0 a4,4 0 0 1 -4,4 h-151.8 z"/><text x="393.8" y="269" class="t2" font-size="12" text-anchor="start" font-weight="400">41%</text><text x="220" y="299" class="t1" font-size="13" text-anchor="end" font-weight="400">Who lives in the home</text><line class="base" x1="230" x2="230" y1="282" y2="306" stroke-width="1"/><path class="s1" d="M230,286 h151.8 a4,4 0 0 1 4,4 v8.0 a4,4 0 0 1 -4,4 h-151.8 z"/><text x="393.8" y="299" class="t2" font-size="12" text-anchor="start" font-weight="400">41%</text><text x="220" y="329" class="t1" font-size="13" text-anchor="end" font-weight="400">Children they could care for</text><line class="base" x1="230" x2="230" y1="312" y2="336" stroke-width="1"/><path class="s1" d="M230,316 h129.0 a4,4 0 0 1 4,4 v8.0 a4,4 0 0 1 -4,4 h-129.0 z"/><text x="371.0" y="329" class="t2" font-size="12" text-anchor="start" font-weight="400">35%</text><text x="220" y="359" class="t1" font-size="13" text-anchor="end" font-weight="400">Driving and vehicle</text><line class="base" x1="230" x2="230" y1="342" y2="366" stroke-width="1"/><path class="s1" d="M230,346 h129.0 a4,4 0 0 1 4,4 v8.0 a4,4 0 0 1 -4,4 h-129.0 z"/><text x="371.0" y="359" class="t2" font-size="12" text-anchor="start" font-weight="400">35%</text><te