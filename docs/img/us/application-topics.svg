</style><rect class="card" x="0.5" y="0.5" width="759" height="553" rx="12" stroke-width="1"/><text x="24" y="34" class="t1" font-size="16" text-anchor="start" font-weight="600">What application forms ask, beyond contact details</text><text x="24" y="56" class="t2" font-size="13" text-anchor="start" font-weight="400">Share of the 17 fillable application forms read that ask about each topic.</text><text x="218" y="95" class="t2" font-size="12" text-anchor="end" font-weight="400">Date of birth or age</text><path class="s1" d="M230,80 h330.4 a4,4 0 0 1 4,4 v16.0 a4,4 0 0 1 -4,4 h-330.4 z"/><text x="572.4" y="96" class="t1" font-size="12" text-anchor="start" font-weight="500">88%</text><text x="218" y="129" class="t2" font-size="12" text-anchor="end" font-weight="400">Race, gender or faith</text><path class="s1" d="M230,114 h243.0 a4,4 0 0 1 4,4 v16.0 a4,4 0 0 1 -4,4 h-243.0 z"/><text x="485.0" y="130" class="t1" font-size="12" text-anchor="start" font-weight="500">65%</text><text x="218" y="163" class="t2" font-size="12" text-anchor="end" font-weight="400">Relationship status</text><path class="s1" d="M230,148 h243.0 a4,4 0 0 1 4,4 v16.0 a4,4 0 0 1 -4,4 h-243.0 z"/><text x="485.0" y="164" class="t1" font-size="12" text-anchor="start" font-weight="500">65%</text><text x="218" y="197" class="t2" font-size="12" text-anchor="end" font-weight="400">Work</text><path class="s1" d="M230,182 h243.0 a4,4 0 0 1 4,4 v16.0 a4,4 0 0 1 -4,4 h-243.0 z"/><text x="485.0" y="198" class="t1" font-size="12" text-anchor="start" font-weight="500">65%</text><text x="218" y="231" class="t2" font-size="12" text-anchor="end" font-weight="400">Fostering or adopting</text><path class="s1" d="M230,216 h220.2 a4,4 0 0 1 4,4 v16.0 a4,4 0 0 1 -4,4 h-220.2 z"/><text x="462.2" y="232" class="t1" font-size="12" text-anchor="start" font-weight="500">59%</text><text x="218" y="265" class="t2" font-size="12" text-anchor="end" font-weight="400">Education</text><path class="s1" d="M230,250 h197.4 a4,4 0 0 1 4,4 v16.0 a4,4 0 0 1 -4,4 h-197.4 z"/><text x="439.4" y="266" class="t1" font-size="12" text-anchor="start" font-weight="500">53%</text><text x="218" y="299" class="t2" font-size="12" text-anchor="end" font-weight="400">Open comment box</text><path class="s1" d="M230,284 h151.8 a4,4 0 0 1 4,4 v16.0 a4,4 0 0 1 -4,4 h-151.8 z"/><text x="393.8" y="300" class="t1" font-size="12" text-anchor="start" font-weight="500">41%</text><text x="218" y="333" class="t2" font-size="12" text-anchor="end" font-weight="400">Who lives in the home</text><path class="s1" d="M230,318 h151.8 a4,4 0 0 1 4,4 v16.0 a4,4 0 0 1 -4,4 h-151.8 z"/><text x="393.8" y="334" class="t1" font-size="12" text-anchor="start" font-weight="500">41%</text><text x="218" y="367" class="t2" font-size="12" text-anchor="end" font-weight="400">Children they could care for</text><path class="s1" d="M230,352 h129.0 a4,4 0 0 1 4,4 v16.0 a4,4 0 0 1 -4,4 h-129.0 z"/><text x="371.0" y="368" class="t1" font-size="12" text-anchor="start" font-weight="500">35%</text><text x="218" y="401" class="t2" font-size="12" text-anchor="end" font-weight="400">Driving and vehicle</text><path class="s1" d="M230,386 h129.0 a4,4 0 0 1 4,4 v16.0 a4,4 0 0 1 -4,4 h-129.0 z"/><text x="371.0" y="402" class="t1" font-size="12" text-anchor="start" font-weight="500">35%</text><text x="218" y="435" class="t2" font-size="12" text-anchor="end" font-weight="400">Earlier marriages</text><path class="s1" d="M230,420 h129.0 a4,4 0 0 1 4,4 v16.0 a4,4 0 0 1 -4,4 h-129.0 z"/><text x="371.0" y="436" class="t1" font-size="12" text-anchor="start" font-weight="500">35%</text><text x="218" y="469" class="t2" font-size="12" text-anchor="end" font-weight="400">Consent to contact</text><path class="s1" d="M230,454 h106.2 a4,4 0 0 1 4,4 v16.0 a4,4 0 0 1 -4,4 h-106.2 z"/><text x="348.2" y="470" class="t1" font-size="12" text-anchor="start" font-weight="500">29%</text><text x="24" y="506" class="t1" font-size="13" text-anchor="start" font-weight="600">A full application asks much more than an enquiry</text><text x="24" y="526" class="t2" font-size="13" text-anchor="start" font-weight="400">Name, address and contact details are left out here.</text></svg>
